services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=flux-production-evaluation-secret-key-32bytes-long
      - DATABASE_URL=sqlite+aiosqlite:///./flux_market.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,*
    volumes:
      - flux_data:/app

volumes:
  flux_data:
